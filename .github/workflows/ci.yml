# Rain FUI — 持续集成 / 发布
#
# 流水线依据 docs/build-contract.md（唯一接口约定）：
#   1) 构建 FFmpeg        scripts/ffmpeg/build-<target>.sh
#   2) 落地进平台工程      scripts/ffmpeg/install-to-app.sh <target>
#   3) 构建 Flutter 应用   flutter build <...>
#   4) 断言产物里真的有 FFmpeg（unzip -l / ls），失败即红
#
# 只构建受支持平台：android / windows / linux（web 暂时废弃，macOS 见 build-macos）；Android 的三个 ABI
# 是三个**独立并行的 job**（build-android 矩阵），不是串在一个 job 里。
# iOS / macOS 放在独立的 build-unsupported job 里，job 级 if 恒为假（默认）
# → GitHub UI 显示为 “skipped”，而不是让用户以为“这些平台没配置”。
# 为什么不能写成矩阵里 skip: true + jobs.<id>.if: !matrix.skip：docs/ci.md。
name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# 最小权限；只有 release job 提升到 contents: write
permissions:
  contents: read

# PR 上新的提交会取消旧的运行；main / tag 的运行互不取消（tag 发布不能被掐断）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 把 pub 缓存钉在 workspace 内，三套 OS 的路径与缓存键才一致（见 docs/ci.md）
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  # FFmpeg 版本（build-contract §1）；version.txt 断言用
  FFMPEG_VERSION: '9.0.2'
  # 必须等于 Flutter 3.47.x 的默认 ndkVersion（FlutterExtension.kt），否则 Gradle 会另找 NDK
  ANDROID_NDK_VERSION: '28.2.13676358'
  # FFmpeg 构建缓存纪元：升级 emsdk / NDK / gcc 等工具链后 +1，强制所有 FFmpeg 缓存失效
  FFMPEG_CACHE_EPOCH: 'v1'
  # 每个 leg 都带第三方编码器（libx264 / libx265 / libaom-av1 / SVT-AV1 / vpx /
  # webp / opus / vorbis / lame）与平台后端（nvenc / vaapi / qsv / MediaCodec）。
  # 缺这些的构建照样编译成功，只是编码器列表悄悄变短 —— 所以下面每个 leg 都用
  # tool/check_expected_encoders.py 兜住，不让“少了一半编码器”的包溜过去。
  FFMPEG_EXTERNAL_LIBS: '1'
  # LTO 在 CI 上换不来速度，只是让链接更慢、缓存更脆弱
  FFMPEG_LTO: '0'
  # 依赖库缓存纪元：改 build-deps.sh 里的库版本或工具链后 +1
  FFMPEG_DEPS_EPOCH: 'v1'

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查 + 单元测试（Lead 的 Dart 测试在 test/；集成测试无二进制时自动 skip）
  # 不拉 FFmpeg 子模块：这一步只关心 Dart 代码，尽快给反馈
  # ---------------------------------------------------------------------------
  analyze-and-test:
    name: analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      # 三个不依赖二进制、也不需要 network 的仓库级检查：文案完整性、UI 硬规则
      # （无模糊、无 Material 图标、无硬编码文案）、编码器/容器表的自洽性。
      - name: Repo checks (i18n / UI rules / capability catalog)
        run: |
          python3 tool/check_i18n.py
          python3 tool/check_ui_rules.py --strict
          dart run tool/check_catalog.dart

      - name: flutter test
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  # 桌面构建（矩阵）：windows / linux 各一个 leg（web 暂时废弃，见 m05703）
  #
  # Android 不在这里：三个 ABI 拆成了各自的 job（build-android），并行跑。
  # 为什么只有这 4 个平台：仓库只 vendor 了 FFmpeg 的 4 套产物（build-contract §5），
  # 且没有 macOS/iOS 的 sign/notarize 凭据（无 secrets）；Windows/Linux/Android/Web
  # 都能用未签名 / debug 签名的产物跑通完整链路。其余平台显式 skip。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }})
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            skip: false
            # 依赖库（x264/x265/aom/svtav1/vpx/webp/opus/vorbis/lame/zlib）在
            # mingw 下逐个编译，比原生构建慢得多
            timeout: 300
            artifact: rain_fui-windows-x64
            ffmpeg_target: windows-x64
            ffmpeg_deps: windows-x64
          - platform: linux
            os: ubuntu-latest
            skip: false
            timeout: 240
            artifact: rain_fui-linux-x64
            ffmpeg_target: linux-x64
            ffmpeg_deps: linux-x64
          # web 暂时废弃（需求 m05703）：leg 与下面的 web 专用 step 全部保留，
          # 只把这一条注释掉即可停止构建；恢复时取消注释即可。
          # - platform: web
          #   os: ubuntu-latest
          #   skip: false
          #   timeout: 240
          #   artifact: rain_fui-web
          #   ffmpeg_target: web
          #   # FFmpeg 的 web 构建从 build/ffmpeg/deps/web-wasm 取库
          #   ffmpeg_deps: web-wasm

    steps:
      # ---------------- 公共 ----------------
      - name: Checkout (+ FFmpeg 子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Resolve FFmpeg submodule revision
        id: ffmpeg-rev
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git -C third_party/ffmpeg rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FFmpeg submodule @ $sha"

      # FFmpeg 构建缓存：键 = (OS, 目标, 子模块 commit, scripts/ffmpeg 内容哈希, 纪元)。
      # 精确命中才复用，绝不跨 OS 共享；actions/cache 默认 post-if: success()，
      # 所以只有构建成功的那次才会写缓存，不会缓存半成品。
      - name: Cache FFmpeg build output
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/dist
            build/ffmpeg/ffbuild
          key: ffmpeg-${{ env.FFMPEG_CACHE_EPOCH }}-${{ runner.os }}-${{ matrix.ffmpeg_target }}-${{ steps.ffmpeg-rev.outputs.sha }}-${{ hashFiles('scripts/ffmpeg/**') }}

      # 依赖前缀单独缓存：它的键与 FFmpeg 自身无关（改 FFmpeg 版本不该重编 aom）
      - name: Cache FFmpeg dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/deps/${{ matrix.ffmpeg_deps }}
            build/ffmpeg/deps/src
          key: ffmpeg-deps-${{ env.FFMPEG_DEPS_EPOCH }}-${{ runner.os }}-${{ matrix.ffmpeg_deps }}-${{ hashFiles('scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/external-libs.sh') }}

      # ---------------- Linux 工具链 ----------------
      - name: Linux · apt 依赖（FFmpeg 构建 + Flutter desktop）
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm yasm pkg-config patch \
            autoconf automake libtool gettext \
            clang cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev \
            zip unzip file
          nasm -v
          clang --version | head -1

      - name: Linux · enable desktop
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      # ---------------- Windows 工具链（FFmpeg 走 MSYS2 MinGW64） ----------------
      - name: Windows · MSYS2 MinGW64 toolchain
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            automake
            autoconf
            libtool

      # ---------------- web 工具链（Emscripten） ----------------
      - name: web · Emscripten SDK
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache

      - name: web · emcc version
        if: matrix.platform == 'web'
        shell: bash
        run: emcc --version | head -1

      # x265 / aom / svtav1 / zlib 走 CMake，vpx / opus / vorbis / x264 走 configure
      - name: web · apt 依赖（cmake / ninja / autotools）
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patch \
            autoconf automake libtool nasm yasm

      # ---------------- 构建 FFmpeg（缓存命中则跳过编译） ----------------
      - name: Prepare scripts
        shell: bash
        run: |
          set -euo pipefail
          ls -l scripts/ffmpeg
          chmod +x scripts/ffmpeg/*.sh

      # ---------------- 第三方依赖库（缓存命中则跳过） ----------------
      - name: FFmpeg deps · build ${{ matrix.ffmpeg_deps }} (MSYS2 MinGW64)
        if: matrix.platform == 'windows' && steps.deps-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash ./scripts/ffmpeg/build-deps.sh --target ${{ matrix.ffmpeg_deps }} --jobs "$(nproc)"

      - name: FFmpeg deps · build ${{ matrix.ffmpeg_deps }}
        if: matrix.platform != 'windows' && steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/ffmpeg/build-deps.sh --target ${{ matrix.ffmpeg_deps }} --jobs "$(nproc)"

      - name: FFmpeg · build windows-x64 (MSYS2 MinGW64)
        if: matrix.platform == 'windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          FFMPEG_DEPS_TARGET: ${{ matrix.ffmpeg_deps }}
        run: bash ./scripts/ffmpeg/build-windows.sh --jobs "$(nproc)"

      - name: FFmpeg · build linux-x64
        if: matrix.platform == 'linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FFMPEG_DEPS_TARGET: ${{ matrix.ffmpeg_deps }}
        run: ./scripts/ffmpeg/build-linux.sh --jobs "$(nproc)" --arch x86_64

      - name: FFmpeg · build web
        if: matrix.platform == 'web' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FFMPEG_DEPS_TARGET: ${{ matrix.ffmpeg_deps }}
        run: ./scripts/ffmpeg/build-web.sh --jobs "$(nproc)"

      # ---------------- 校验 FFmpeg 产物（build-contract §9.1 / §9.3） ----------------
      - name: Verify FFmpeg dist
        shell: bash
        run: |
          set -euo pipefail
          DIST="build/ffmpeg/dist/${{ matrix.ffmpeg_target }}"
          echo "== $DIST =="
          ls -l "$DIST" || { echo "::error::缺少目录 $DIST"; exit 1; }
          if [ ! -s "$DIST/version.txt" ]; then
            echo "::error::$DIST/version.txt 缺失或为空（build-contract §5）"
            exit 1
          fi
          cat "$DIST/version.txt"
          # FFmpeg 的版本串来自 git describe：CI 的 submodule 没有 tag，只会打印
          # 提交号（"ffmpeg version 946fcce"）。tag、n 前缀、源码提交号三者任一
          # 都算通过，和 scripts/ffmpeg/common.sh 的断言保持一致。
          ffmpeg_sha="$(git -C third_party/ffmpeg rev-parse --short HEAD)"
          version_ok=0
          for token in "${{ env.FFMPEG_VERSION }}" "n${{ env.FFMPEG_VERSION }}" "$ffmpeg_sha"; do
            [ -n "$token" ] || continue
            if grep -qF -- "$token" "$DIST/version.txt"; then version_ok=1; break; fi
          done
          if [ "$version_ok" != 1 ]; then
            echo "::error::version.txt 里既没有 ${{ env.FFMPEG_VERSION }} 也没有提交号 $ffmpeg_sha"
            exit 1
          fi

      - name: Verify the third-party encoders are really inside this build
        shell: bash
        run: |
          set -euo pipefail
          # 少了这一条，CI 会愉快地发布一个只剩原生编码器的包：编译成功、
          # 版本号正确，只是编码器列表短了一半。
          # windows-latest 上 python3 不一定在 PATH，取第一个能用的解释器
          PY="$(command -v python3 || command -v python || command -v py)"
          "$PY" tool/check_expected_encoders.py \
            --target "${{ matrix.ffmpeg_target }}" \
            --expect libx264,libx265,libaom-av1,libsvtav1,libvpx,libvpx-vp9,libwebp,libopus,libvorbis,libmp3lame,zmbv

      - name: Verify FFmpeg binary runs (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          F=build/ffmpeg/dist/linux-x64/ffmpeg
          "$F" -version | head -1
          # 同 version.txt 的断言：tag / n 前缀 / submodule 提交号任一即可
          ffmpeg_sha="$(git -C third_party/ffmpeg rev-parse --short HEAD)"
          version_line="$("$F" -version | head -1)"
          case "$version_line" in
            *"${{ env.FFMPEG_VERSION }}"*|*"n${{ env.FFMPEG_VERSION }}"*|*"$ffmpeg_sha"*) ;;
            *) echo "::error::版本行既没有 ${{ env.FFMPEG_VERSION }} 也没有提交号 $ffmpeg_sha：$version_line"; exit 1 ;;
          esac
          # 冒烟测试：静态二进制真的能跑（不能只信 ls 出来的文件）
          "$F" -hide_banner -loglevel error -f lavfi -i testsrc=duration=1:size=64x64:rate=5 \
            -frames:v 3 -f null - && echo "ffmpeg encode smoke test: ok"

      - name: Verify FFmpeg binary runs (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = "build/ffmpeg/dist/windows-x64/ffmpeg.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $out = & $exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe -version exited $LASTEXITCODE" }
          $line = ($out | Select-Object -First 1)
          if (-not $line) { throw "ffmpeg.exe -version 没有任何输出" }
          $line
          # 同 version.txt 的断言：tag / n 前缀 / submodule 提交号任一即可
          $sha = (git -C third_party/ffmpeg rev-parse --short HEAD)
          $tokens = @("${{ env.FFMPEG_VERSION }}", "n${{ env.FFMPEG_VERSION }}", "$sha")
          $hit = $false
          foreach ($t in $tokens) {
            if ($t -and $line.Contains($t)) { $hit = $true; break }
          }
          if (-not $hit) {
            throw "ffmpeg.exe 的版本行既没有 ${{ env.FFMPEG_VERSION }} 也没有提交号 ${sha}: $line"
          }

      # ---------------- 落地进平台工程（build-contract §8） ----------------
      - name: Install FFmpeg into app (windows-x64)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: bash ./scripts/ffmpeg/install-to-app.sh windows-x64

      - name: Install FFmpeg into app (linux-x64)
        if: matrix.platform == 'linux'
        shell: bash
        run: ./scripts/ffmpeg/install-to-app.sh linux-x64

      - name: Install FFmpeg into app (web)
        if: matrix.platform == 'web'
        shell: bash
        run: ./scripts/ffmpeg/install-to-app.sh web

      - name: Verify install-to-app really replaced the app-tree binary
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || command -v py)"
          "$PY" tool/check_packaged.py --only "${{ matrix.ffmpeg_target }}"

      # ---------------- flutter build ----------------
      - name: flutter build windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: flutter build windows --release

      - name: flutter build linux
        if: matrix.platform == 'linux'
        shell: bash
        run: flutter build linux --release

      - name: flutter build web
        if: matrix.platform == 'web'
        shell: bash
        run: flutter build web --release

      # ---------------- 断言 FFmpeg 真的进了应用产物 ----------------
      - name: Assert FFmpeg inside windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/ffmpeg.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Path build/windows -Recurse -Filter "ffmpeg*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "windows bundle 里没有 ffmpeg.exe: $exe"
          }
          Get-Item $exe | Format-List Name, Length, FullName
          if (-not (Test-Path "build/windows/x64/runner/Release/rain_fui.exe")) { throw "bundle 里没有 rain_fui.exe" }

      - name: Assert FFmpeg inside linux bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          FF=build/linux/x64/release/bundle/lib/ffmpeg
          if [ ! -f "$FF" ]; then
            echo "::error::linux bundle 里没有 $FF"
            find build/linux \( -name 'ffmpeg*' -o -name 'rain_fui' \) | head -20 || true
            exit 1
          fi
          ls -l "$FF" build/linux/x64/release/bundle/rain_fui
          file "$FF"
          # 必须是可执行 ELF，不是被当数据拷进去的占位文件
          test -x "$FF" || { echo "::error::$FF 没有可执行位（CMake install(PROGRAMS ...) 少了？）"; exit 1; }
          "$FF" -version | head -1

      - name: Assert FFmpeg inside web build
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/ffmpeg/ffmpeg.wasm || {
            echo "::error::build/web/ffmpeg/ffmpeg.wasm 缺失（build-contract §9.5）"
            find build/web -maxdepth 2 -type d | head -20 || true
            exit 1
          }
          test -f build/web/ffmpeg/ffmpeg.js || { echo "::error::build/web/ffmpeg/ffmpeg.js 缺失"; exit 1; }
          ls -l build/web/ffmpeg
          test -s build/web/index.html || { echo "::error::build/web/index.html 缺失"; exit 1; }

      - name: Run FFmpeg wasm smoke test (real transcode)
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::没有可用的 Chromium/Chrome，跳过 wasm 真实转码 smoke（本地请跑 tool/serve_web.py --smoke）"
            exit 0
          fi
          python3 tool/serve_web.py --smoke --port 8080 --host 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/__smoke.html; then break; fi
            sleep 0.2
          done
          timeout 300 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --dump-dom http://127.0.0.1:8080/__smoke.html > /tmp/web_smoke.html
          # Only the rendered <pre id="out"> counts: the page's own script
          # text also contains the marker, so grepping the whole document
          # would pass even when the transcode failed.
          RESULT="$(tr '\n' ' ' < /tmp/web_smoke.html | sed -n 's/.*<pre id="out">\([^<]*\)<\/pre>.*/\1/p')"
          printf '%s\n' "$RESULT"
          case "$RESULT" in
            *SMOKE_OK*) echo "wasm transcode OK" ;;
            *)
              echo "::error::wasm 真实转码失败（期望 <pre> 里出现 SMOKE_OK）"
              sed -n '1,80p' /tmp/web_smoke.html
              exit 1
              ;;
          esac

      # ---------------- 打包 + 上传（release job 直接复用这些文件） ----------------
      - name: Package linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/rain_fui" build/release-artifacts
          cp -a build/linux/x64/release/bundle/. "$STAGE/rain_fui/"
          if [ -d LICENSES/ffmpeg ]; then cp -a LICENSES/ffmpeg "$STAGE/rain_fui/LICENSES"; fi
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/rain_fui/LICENSE"; fi
          if [ -f NOTICE ]; then cp NOTICE "$STAGE/rain_fui/NOTICE"; fi
          cp build/ffmpeg/dist/linux-x64/version.txt "$STAGE/rain_fui/FFMPEG-VERSION.txt"
          tar -czf build/release-artifacts/rain_fui-linux-x64.tar.gz -C "$STAGE" rain_fui
          # sed 读完整个输入，不会像 head 那样提前关管道把 tar 弄成 exit 2
          tar -tzf build/release-artifacts/rain_fui-linux-x64.tar.gz | sed -n '1,10p'
          ls -l build/release-artifacts

      - name: Package windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = "build/release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $pkg = "build/pkg/rain_fui"
          Remove-Item -Recurse -Force "build/pkg" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $pkg
          if (Test-Path "LICENSES/ffmpeg") { Copy-Item -Recurse -Force "LICENSES/ffmpeg" "$pkg/LICENSES" }
          if (Test-Path "LICENSE") { Copy-Item -Force "LICENSE" "$pkg/LICENSE" }
          if (Test-Path "NOTICE") { Copy-Item -Force "NOTICE" "$pkg/NOTICE" }
          Copy-Item -Force "build/ffmpeg/dist/windows-x64/version.txt" "$pkg/FFMPEG-VERSION.txt"
          Compress-Archive -Path $pkg -DestinationPath "$stage/rain_fui-windows-x64.zip" -Force
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Package web
        if: matrix.platform == 'web'
        shell: bash
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/rain_fui-web" build/release-artifacts
          cp -a build/web/. "$STAGE/rain_fui-web/"
          if [ -d LICENSES/ffmpeg ]; then cp -a LICENSES/ffmpeg "$STAGE/rain_fui-web/LICENSES"; fi
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/rain_fui-web/LICENSE"; fi
          if [ -f NOTICE ]; then cp NOTICE "$STAGE/rain_fui-web/NOTICE"; fi
          cp build/ffmpeg/dist/web/version.txt "$STAGE/rain_fui-web/FFMPEG-VERSION.txt"
          ( cd "$STAGE" && zip -qr "$OLDPWD/build/release-artifacts/rain_fui-web.zip" rain_fui-web )
          unzip -l build/release-artifacts/rain_fui-web.zip | sed -n '1,10p'
          ls -l build/release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/release-artifacts
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS：两套依赖（arm64 / x86_64）→ 一个 universal 产物 → ad-hoc 签名。
  #
  # 没有 Developer ID 凭据，所以不 notarize；这里只验证四件事：依赖编得出来、
  # FFmpeg 是 universal、helper 进了 .app 并且能跑、打包前后的哈希一致。
  # ---------------------------------------------------------------------------
  build-macos:
    name: build (macos)
    needs: analyze-and-test
    runs-on: macos-14
    timeout-minutes: 300
    env:
      FFMPEG_EXTERNAL_LIBS: '1'
      FFMPEG_LTO: '0'
      FFMPEG_DEPS_EPOCH: v1
    steps:
      - name: Checkout (+ FFmpeg 子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Resolve FFmpeg submodule revision
        id: ffmpeg-rev
        run: |
          set -euo pipefail
          sha=$(git -C third_party/ffmpeg rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FFmpeg submodule @ $sha"

      - name: 工具（nasm / pkg-config）
        run: |
          set -euo pipefail
          # 镜像通常自带这两个，装不上也别直接失败；nasm 只影响 x86_64 那份的
          # aom/vpx 汇编（缺失时自动退化成 C），pkg-config 则是硬需求。
          brew install nasm pkg-config || brew upgrade nasm pkg-config || true
          nasm -v || echo "::warning::nasm 缺失：x86_64 的 aom/libvpx 将走 C 实现"
          pkg-config --version || { echo "::error::pkg-config 缺失，无法定位依赖前缀"; exit 1; }

      # 系统自带的 /bin/bash 是 3.2：mapfile、空数组展开这些都要 4+，否则脚本会在
      # 依赖配方深处报 "cross[@]: unbound variable"。装一个 5.x 并放到 PATH 前面，
      # 后面所有 `shell: bash` 的 step 就都用它了。
      - name: 用 Homebrew 的 bash（系统 3.2 跑不了这些脚本）
        run: |
          set -euo pipefail
          brew install bash || brew upgrade bash || true
          BASH_BIN="$(brew --prefix)/bin"
          echo "$BASH_BIN" >> "$GITHUB_PATH"
          "$BASH_BIN/bash" --version | head -1

      - name: Prepare scripts
        run: |
          set -euo pipefail
          bash --version | head -1
          chmod +x scripts/ffmpeg/*.sh

      - name: Cache FFmpeg dependency prefixes
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/deps/macos-arm64
            build/ffmpeg/deps/macos-x64
            build/ffmpeg/deps/src
          key: ffmpeg-deps-${{ env.FFMPEG_DEPS_EPOCH }}-macos-${{ hashFiles('scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/external-libs.sh') }}

      - name: FFmpeg deps · arm64 + x86_64
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./scripts/ffmpeg/build-deps.sh --target macos-arm64 --jobs "$(sysctl -n hw.ncpu)"
          ./scripts/ffmpeg/build-deps.sh --target macos-x64 --jobs "$(sysctl -n hw.ncpu)"

      - name: Cache FFmpeg build trees
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/ffbuild/macos-arm64
            build/ffmpeg/ffbuild/macos-x64
            build/ffmpeg/dist/macos
          key: ffmpeg-build-${{ env.FFMPEG_CACHE_EPOCH }}-macos-${{ steps.ffmpeg-rev.outputs.sha }}-${{ hashFiles('scripts/ffmpeg/build-macos.sh', 'scripts/ffmpeg/common.sh', 'scripts/ffmpeg/external-libs.sh') }}

      - name: FFmpeg · build universal
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./scripts/ffmpeg/build-macos.sh --jobs "$(sysctl -n hw.ncpu)"

      - name: Assert encoders and hardware back ends
        run: |
          set -euo pipefail
          python3 tool/check_expected_encoders.py --target macos \
            --expect libx264,libx265,libaom-av1,libsvtav1,libvpx,libvpx-vp9,libwebp,libopus,libvorbis,libmp3lame,zmbv,h264_videotoolbox,hevc_videotoolbox \
            --forbid h264_nvenc,h264_vaapi,h264_amf,h264_qsv,h264_mediacodec
          ./build/ffmpeg/dist/macos/ffmpeg -hide_banner -version | head -3
          lipo -info ./build/ffmpeg/dist/macos/ffmpeg

      - name: Install FFmpeg into app (macos)
        run: ./scripts/ffmpeg/install-to-app.sh macos

      - name: flutter build macos --release
        run: flutter build macos --release

      - name: Assert the helper is inside the bundle and runnable
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/rain_fui.app"
          HELPER="$APP/Contents/Frameworks/ffmpeg"
          if [ ! -x "$HELPER" ]; then
            echo "::error::$HELPER 缺失或不可执行（Embed ffmpeg 构建阶段没有跑到）"
            find "$APP/Contents" -maxdepth 2 -type d | head -20 || true
            exit 1
          fi
          lipo -info "$HELPER"
          codesign -dv "$HELPER" 2>&1 | sed -n '1,3p'
          "$HELPER" -hide_banner -version | head -2

      - name: Assert the packaged tree matches dist
        run: python3 tool/check_packaged.py --only macos

      - name: Package macos
        run: |
          set -euo pipefail
          mkdir -p build/release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/rain_fui.app" \
            build/release-artifacts/rain_fui-macos.zip
          # 别的 leg 把 version.txt 放进包里，这里是散文件，加后缀避免重名
          cp build/ffmpeg/dist/macos/version.txt build/release-artifacts/FFMPEG-VERSION-macos.txt
          ls -l build/release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rain_fui-macos
          path: build/release-artifacts
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android：三个 ABI = 三个独立 job，**并行**跑。
  #
  # 为什么拆开：三个 ABI 的交叉编译互不依赖（各自 build/ffmpeg/ffbuild/android-<abi>
  # 与 dist/android-<abi>，缓存键也是 per-ABI）。塞进一个 job 只能串行约 40 分钟；
  # 拆开后墙钟时间≈最慢的那个 ABI。代价是 runner 分钟数略增（3 × SDK/NDK 安装）。
  #
  # 矩阵里没有 platform 字段，所以这些 step 不再需要 `if: matrix.platform == 'android'`。
  # ---------------------------------------------------------------------------
  build-android:
    name: build (android-${{ matrix.abi }})
    needs: analyze-and-test
    runs-on: ubuntu-latest
    # 每个 ABI 都要先编 9 个依赖库（x264/x265/aom/svtav1/vpx/webp/opus/vorbis/
    # lame），再编 FFmpeg 与 APK；arm64 与 x86_64 的 aom 段最慢
    timeout-minutes: 300
    strategy:
      fail-fast: false # 一个 ABI 红了，另外两个仍然跑完，便于一次看全
      matrix:
        include:
          - abi: arm64-v8a
            target_platform: android-arm64
          - abi: armeabi-v7a
            target_platform: android-arm
          - abi: x86_64
            target_platform: android-x64

    steps:
      - name: Checkout (+ FFmpeg 子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Resolve FFmpeg submodule revision
        id: ffmpeg-rev
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git -C third_party/ffmpeg rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FFmpeg submodule @ $sha"

      # 每个 ABI 一份缓存：键里带 abi，leg 之间不会互相污染
      - name: Cache FFmpeg build output
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/dist
            build/ffmpeg/ffbuild
          key: ffmpeg-${{ env.FFMPEG_CACHE_EPOCH }}-${{ runner.os }}-android-${{ matrix.abi }}-${{ steps.ffmpeg-rev.outputs.sha }}-${{ hashFiles('scripts/ffmpeg/**') }}

      # 每个 ABI 一个依赖前缀：键里带 abi，leg 之间不互相污染，缓存也不会
      # 把 arm64 的 .a 当成 x86_64 的
      - name: Cache FFmpeg dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/deps/android-${{ matrix.abi }}
            build/ffmpeg/deps/src
          key: ffmpeg-deps-${{ env.FFMPEG_DEPS_EPOCH }}-${{ runner.os }}-android-${{ matrix.abi }}-${{ hashFiles('scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/external-libs.sh') }}

      - name: Android · JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不要用 setup-android 的默认 packages：它默认装 `tools platform-tools`，
      # 而 `tools` 这个包已经从 SDK 仓库里下掉了（cmdline-tools 取代了它），
      # sdkmanager 报 "Failed to find package 'tools'" 并以 1 退出，三个 ABI 会在
      # 同一行一起红。这里只留 platform-tools，NDK 与 CMake 由下一步显式安装。
      - name: Android · Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android · NDK + CMake, export ANDROID_NDK_HOME
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # NDK 必须有：build-deps.sh 和 flutter.ndkVersion 都指向它
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}" >/dev/null
          # CMake 只是给 Gradle 的 native 构建兜底。本项目没有 CMake 原生模块，
          # 万一这个包在仓库里改了名，不要让它把整个 leg 一起掀翻。
          sdkmanager --install "cmake;3.22.1" >/dev/null \
            || echo "::warning::cmake;3.22.1 未安装（本项目没有 CMake 原生模块，可忽略）"
          NDK_HOME="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          if [ ! -d "$NDK_HOME" ]; then
            echo "::error::NDK ${{ env.ANDROID_NDK_VERSION }} 未安装到 $NDK_HOME"
            exit 1
          fi
          cat "$NDK_HOME/source.properties" || true
          {
            echo "ANDROID_NDK_HOME=$NDK_HOME"
            echo "ANDROID_NDK_ROOT=$NDK_HOME"
            echo "ANDROID_NDK=$NDK_HOME"
          } >> "$GITHUB_ENV"

      - name: Android · Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Android · apt 依赖（FFmpeg 与依赖库都要 autotools / cmake）
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patch \
            autoconf automake libtool nasm yasm

      - name: Prepare scripts
        shell: bash
        run: |
          set -euo pipefail
          ls -l scripts/ffmpeg
          chmod +x scripts/ffmpeg/*.sh

      - name: FFmpeg deps · build android-${{ matrix.abi }}
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/ffmpeg/build-deps.sh --target android-${{ matrix.abi }} --jobs "$(nproc)"

      - name: FFmpeg · build android-${{ matrix.abi }}
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FFMPEG_DEPS_TARGET: android-${{ matrix.abi }}
        run: ./scripts/ffmpeg/build-android.sh --jobs "$(nproc)" --abis ${{ matrix.abi }} --api 24

      - name: Verify FFmpeg dist
        shell: bash
        run: |
          set -euo pipefail
          DIST="build/ffmpeg/dist/android-${{ matrix.abi }}"
          echo "== $DIST =="
          ls -l "$DIST" || { echo "::error::缺少目录 $DIST"; exit 1; }
          if [ ! -s "$DIST/version.txt" ]; then
            echo "::error::$DIST/version.txt 缺失或为空（build-contract §5）"
            exit 1
          fi
          cat "$DIST/version.txt"
          # FFmpeg 的版本串来自 git describe：CI 的 submodule 没有 tag，只会打印
          # 提交号（"ffmpeg version 946fcce"）。tag、n 前缀、源码提交号三者任一
          # 都算通过，和 scripts/ffmpeg/common.sh 的断言保持一致。
          ffmpeg_sha="$(git -C third_party/ffmpeg rev-parse --short HEAD)"
          version_ok=0
          for token in "${{ env.FFMPEG_VERSION }}" "n${{ env.FFMPEG_VERSION }}" "$ffmpeg_sha"; do
            [ -n "$token" ] || continue
            if grep -qF -- "$token" "$DIST/version.txt"; then version_ok=1; break; fi
          done
          if [ "$version_ok" != 1 ]; then
            echo "::error::version.txt 里既没有 ${{ env.FFMPEG_VERSION }} 也没有提交号 $ffmpeg_sha"
            exit 1
          fi
          file "$DIST/libffmpeg_exe.so"

      - name: Verify the third-party encoders and MediaCodec are inside this build
        shell: bash
        run: |
          set -euo pipefail
          # Android 的列表里必须同时有软件编码器和 MediaCodec：前者来自我们自己
          # 编的库，后者需要 --enable-jni --enable-mediacodec（external-libs.sh）
          python3 tool/check_expected_encoders.py \
            --target "android-${{ matrix.abi }}" \
            --expect libx264,libx265,libaom-av1,libsvtav1,libvpx,libvpx-vp9,libwebp,libopus,libvorbis,libmp3lame,zmbv,h264_mediacodec,hevc_mediacodec

      - name: Install FFmpeg into app (android-${{ matrix.abi }})
        shell: bash
        run: ./scripts/ffmpeg/install-to-app.sh android-${{ matrix.abi }}

      - name: Verify install-to-app really replaced the jniLibs binary
        shell: bash
        run: python3 tool/check_packaged.py --only "android-${{ matrix.abi }}"

      - name: flutter build apk (${{ matrix.abi }}, split-per-abi)
        shell: bash
        run: flutter build apk --release --target-platform ${{ matrix.target_platform }} --split-per-abi

      - name: Assert FFmpeg inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK 不存在: $APK"
            ls -l build/app/outputs/flutter-apk || true
            exit 1
          fi
          ls -l "$APK"
          if ! unzip -l "$APK" | grep -qE "lib/${{ matrix.abi }}/libffmpeg_exe\.so"; then
            echo "::error::APK 里没有 lib/${{ matrix.abi }}/libffmpeg_exe.so（install-to-app 没落地？）"
            unzip -l "$APK" | grep -E '\.so$' || echo "（APK 内没有任何 .so）"
            exit 1
          fi
          # 运行时需要解压成可执行文件，见 build-contract §8；只告警，布局由 Lead 维护
          if ! grep -q 'extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml; then
            echo "::warning::AndroidManifest.xml 缺 android:extractNativeLibs=\"true\"，libffmpeg_exe.so 运行时不会被解压（build-contract §8）"
          fi
          if ! grep -rq 'useLegacyPackaging' android/app/build.gradle.kts; then
            echo "::warning::android/app/build.gradle.kts 里没有 useLegacyPackaging = true（build-contract §8）"
          fi

      - name: Package android-${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-artifacts
          cp build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk \
             build/release-artifacts/rain_fui-android-${{ matrix.abi }}.apk
          cp build/ffmpeg/dist/android-${{ matrix.abi }}/version.txt \
             build/release-artifacts/rain_fui-android-${{ matrix.abi }}-ffmpeg-version.txt
          ls -l build/release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rain_fui-android-${{ matrix.abi }}
          path: build/release-artifacts
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS / macOS：**故意**整条跳过，但仍然出现在 CI 图里（用户要求“其他平台直接跳过
  # 构建”，跳过必须看得见，不能像没配置一样消失）。
  #
  # 为什么不用 `if: ${{ !matrix.skip }}` 挂在 build 矩阵上？
  #   GitHub 在矩阵展开**之前**就求值 jobs.<id>.if，可用的 context 只有
  #   github / needs / vars / inputs（官方 Contexts 表），matrix 在那里会直接报
  #   "Unrecognized named-value: 'matrix'" 并让整个 workflow 无效。
  #   所以拆成独立 job：job 级 if 为假 → 每个矩阵 leg 在 UI 里显示为 skipped。
  #
  # 想真正支持某个平台时：把仓库变量 BUILD_UNSUPPORTED_PLATFORMS 设为 true（仍会
  # 显式失败并给出原因），或直接把这个 job 改造成真正的构建 job 并删掉占位步骤。
  # ---------------------------------------------------------------------------
  build-unsupported:
    name: build (${{ matrix.platform }}) — 未支持，跳过
    if: ${{ vars.BUILD_UNSUPPORTED_PLATFORMS == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-14
            skip: true
            reason: 未 vendor iOS 版 FFmpeg 静态库，且仓库没有签名/描述文件凭据
          - platform: macos
            os: macos-14
            skip: true
            reason: 未 vendor macOS 版 FFmpeg 静态库，且没有 Developer ID 公证凭据
    steps:
      - name: Explain why this platform is not built
        run: |
          echo "::error::${{ matrix.platform }} 不在支持范围内：${{ matrix.reason }}。详见 docs/ci.md。"
          exit 1

  # ---------------------------------------------------------------------------
  # 发布：仅 tag v* 触发；把 build 已打好的包直接挂到 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs:
      - analyze-and-test
      - build
      - build-macos
      - build-android
    # 矩阵里被 skip 的 leg 不影响 needs.build 的总体结论（success），但这里显式写成
    # result == 'success'，避免“构建被跳过却发布了空包”
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.build-macos.result == 'success'
          && needs.build-android.result == 'success'
          && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # softprops/action-gh-release 需要写 release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 只有这里需要完整历史/tag：生成 release notes 时用
          fetch-depth: 0
          submodules: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lR artifacts

      - name: Pack FFmpeg license bundle (build-contract §2)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d LICENSES/ffmpeg ]; then
            tar -czf "artifacts/rain_fui-ffmpeg-licenses-${GITHUB_REF_NAME}.tar.gz" LICENSES/ffmpeg
          else
            echo "::warning::LICENSES/ffmpeg 不存在：发布包缺少 FFmpeg 许可证原文（build-contract §2 要求随二进制分发）"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
